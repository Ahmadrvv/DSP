<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Distortion Maker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LameJS untuk MP3 Encoding -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>

    <style>
        /* Desain Khusus & Dark Mode */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            overscroll-behavior-y: none;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1e1e1e; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .glass-panel {
            background: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .slider-custom {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #374151;
            border-radius: 5px;
            outline: none;
        }
        .slider-custom::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .slider-custom.vocal::-webkit-slider-thumb { background: #ec4899; box-shadow: 0 0 10px rgba(236, 72, 153, 0.5); }
        .slider-custom.music::-webkit-slider-thumb { background: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }

        canvas { image-rendering: pixelated; }
        
        .bottom-sheet-enter { transform: translateY(100%); opacity: 0; }
        .bottom-sheet-enter-active { transform: translateY(0); opacity: 1; transition: all 300ms ease-out; }
        .bottom-sheet-exit { transform: translateY(0); opacity: 1; }
        .bottom-sheet-exit-active { transform: translateY(100%); opacity: 0; transition: all 300ms ease-in; }

        .btn-dist { transition: all 0.2s; }
        .btn-dist.active { box-shadow: 0 0 15px currentColor; border-color: currentColor; }
    </style>
</head>
<body class="antialiased selection:bg-blue-500 selection:text-white flex justify-center">

    <div id="root" class="w-full max-w-md min-h-screen bg-[#121212] relative shadow-2xl overflow-hidden flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        function makeDistCurve(amount) {
            let k = amount, n = 44100, curve = new Float32Array(n), deg = Math.PI / 180;
            for (let i = 0; i < n; ++i) {
                let x = (i * 2 / n) - 1;
                curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        function makeCrushCurve(bits) {
            let n = 44100, curve = new Float32Array(n);
            let steps = Math.pow(2, bits);
            for(let i=0; i<n; i++) {
                let x = (i * 2 / n) - 1;
                curve[i] = Math.round(x * steps) / steps;
            }
            return curve;
        }

        function makeHardClipCurve() {
            let n = 44100, curve = new Float32Array(n);
            for (let i = 0; i < n; ++i) {
                let x = (i * 2 / n) - 1;
                curve[i] = x < -0.2 ? -0.2 : (x > 0.2 ? 0.2 : x);
            }
            return curve;
        }

        function buildEffectChain(ctx, activeDistortions) {
            let input = ctx.createGain();
            let current = input;
            let nodes = [input];

            // Urutkan dari 1 s/d 10 agar rantainya beraturan saat digabungkan
            const dists = [...activeDistortions].sort((a,b) => a - b);

            dists.forEach(d => {
                let fxIn = ctx.createGain();
                let fxOut = ctx.createGain();
                current.connect(fxIn);
                
                // 10 TEMPLATE DISTORSI DJ
                if (d === 1) { // Soft Overdrive
                    let ws = ctx.createWaveShaper(); ws.curve = makeDistCurve(50);
                    fxIn.connect(ws); ws.connect(fxOut); nodes.push(ws);
                }
                else if (d === 2) { // Heavy Fuzz
                    let ws = ctx.createWaveShaper(); ws.curve = makeDistCurve(400);
                    fxIn.connect(ws); ws.connect(fxOut); nodes.push(ws);
                }
                else if (d === 3) { // 8-Bit Crusher (Kasar medium)
                    let ws = ctx.createWaveShaper(); ws.curve = makeCrushCurve(4);
                    fxIn.connect(ws); ws.connect(fxOut); nodes.push(ws);
                }
                else if (d === 4) { // 4-Bit Crusher (Kasar ekstrem)
                    let ws = ctx.createWaveShaper(); ws.curve = makeCrushCurve(2);
                    fxIn.connect(ws); ws.connect(fxOut); nodes.push(ws);
                }
                else if (d === 5) { // Robot Vocoder 1 (Ring Modulator - Gelombang Sine Rendah)
                    let osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = 50;
                    let rmGain = ctx.createGain(); rmGain.gain.value = 0;
                    osc.connect(rmGain.gain);
                    fxIn.connect(rmGain); rmGain.connect(fxOut); nodes.push(osc, rmGain);
                }
                else if (d === 6) { // Alien Vocoder 2 (Ring Modulator - Gelombang Square Tinggi)
                    let osc = ctx.createOscillator(); osc.type = 'square'; osc.frequency.value = 200;
                    let rmGain = ctx.createGain(); rmGain.gain.value = 0;
                    osc.connect(rmGain.gain);
                    fxIn.connect(rmGain); rmGain.connect(fxOut); nodes.push(osc, rmGain);
                }
                else if (d === 7) { // Pipa Logam (Metallic Comb Filter)
                    let delay = ctx.createDelay(); delay.delayTime.value = 0.015;
                    let feedback = ctx.createGain(); feedback.gain.value = 0.85;
                    fxIn.connect(delay); delay.connect(feedback); feedback.connect(delay); delay.connect(fxOut);
                    fxIn.connect(fxOut); // Mix dry
                    nodes.push(delay, feedback);
                }
                else if (d === 8) { // Radio Distorsi
                    let bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1000;
                    let ws = ctx.createWaveShaper(); ws.curve = makeDistCurve(200);
                    fxIn.connect(bp); bp.connect(ws); ws.connect(fxOut); nodes.push(bp, ws);
                }
                else if (d === 9) { // Chopper/Tremolo Glitch
                    let osc = ctx.createOscillator(); osc.type = 'square'; osc.frequency.value = 15;
                    let amGain = ctx.createGain(); amGain.gain.value = 0;
                    osc.connect(amGain.gain);
                    fxIn.connect(amGain); amGain.connect(fxOut); nodes.push(osc, amGain);
                }
                else if (d === 10) { // NUCLEAR (Hard Clipping + Boost)
                    let preGain = ctx.createGain(); preGain.gain.value = 10; // Boost gila-gilaan
                    let ws = ctx.createWaveShaper(); ws.curve = makeHardClipCurve();
                    let postGain = ctx.createGain(); postGain.gain.value = 0.2; // Turunkan agar speaker aman
                    fxIn.connect(preGain); preGain.connect(ws); ws.connect(postGain); postGain.connect(fxOut);
                    nodes.push(preGain, ws, postGain);
                }

                nodes.push(fxIn, fxOut);
                current = fxOut;
            });

            let output = ctx.createGain();
            current.connect(output);
            nodes.push(output);

            return { input, output, nodes };
        }


        class AudioEngine {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.originalBuffer = null;
                this.vocalBuffer = null;
                this.musicBuffer = null;
                
                this.vocalSource = null;
                this.musicSource = null;
                
                this.masterGain = this.ctx.createGain();
                this.masterGain.connect(this.ctx.destination);

                this.vocalAnalyser = this.ctx.createAnalyser();
                this.musicAnalyser = this.ctx.createAnalyser();
                this.vocalAnalyser.fftSize = 128; 
                this.musicAnalyser.fftSize = 128;

                this.isPlaying = false;
                this.startTime = 0;
                this.pauseTime = 0;
                this.duration = 0;

                // State Audio per Jalur (Volume terpisah & Efek terpisah)
                this.tracks = {
                    vocal: { muted: false, volume: 1, activeDistortions: [], activeLevel: null, volumeNode: null, effectNodes: [] },
                    music: { muted: false, volume: 1, activeDistortions: [], activeLevel: null, volumeNode: null, effectNodes: [] }
                };
            }

            async loadAudio(file, onProgress) {
                onProgress(10, "Membaca file audio...");
                const arrayBuffer = await file.arrayBuffer();
                onProgress(40, "Mendekode audio (harap tunggu)...");
                this.originalBuffer = await this.ctx.decodeAudioData(arrayBuffer);
                this.duration = this.originalBuffer.duration;
                
                onProgress(70, "Memisahkan Vokal dan Musik...");
                await this.splitAudio();
                
                onProgress(90, "Menyiapkan Studio DJ...");
                this.initBaseNodes();
            }

            async splitAudio() {
                const sr = this.originalBuffer.sampleRate;
                const len = this.originalBuffer.length;
                this.vocalBuffer = this.ctx.createBuffer(1, len, sr);
                this.musicBuffer = this.ctx.createBuffer(2, len, sr);
                const L = this.originalBuffer.getChannelData(0);
                const R = this.originalBuffer.numberOfChannels > 1 ? this.originalBuffer.getChannelData(1) : L;
                const vocData = this.vocalBuffer.getChannelData(0);
                const musL = this.musicBuffer.getChannelData(0);
                const musR = this.musicBuffer.getChannelData(1);
                
                // Phase cancellation sederhana untuk ekstrak Vokal
                for (let i = 0; i < len; i++) {
                    vocData[i] = (L[i] + R[i]) * 0.5;
                    musL[i] = L[i] - vocData[i];
                    musR[i] = R[i] - vocData[i];
                }
            }

            initBaseNodes() {
                // Buat Node Volume Utama untuk tiap track agar slider volume bekerja independen dari efek
                this.tracks.vocal.volumeNode = this.ctx.createGain();
                this.tracks.music.volumeNode = this.ctx.createGain();

                // Analyser menyambung ke Master
                this.vocalAnalyser.connect(this.masterGain);
                this.musicAnalyser.connect(this.masterGain);

                this.rebuildTrackEffects('vocal');
                this.rebuildTrackEffects('music');
            }

            rebuildTrackEffects(trackName) {
                const track = this.tracks[trackName];
                
                // Putuskan & matikan semua node efek yang lama
                if (track.effectNodes) {
                    track.effectNodes.forEach(n => {
                        try { n.disconnect(); if (n.stop) n.stop(); } catch(e) {}
                    });
                }
                
                // Bangun ulang rantai efek
                const chain = buildEffectChain(this.ctx, track.activeDistortions);
                track.effectNodes = chain.nodes;

                // Routing: VolumeNode -> Effect Chain -> Analyser
                track.volumeNode.disconnect();
                track.volumeNode.connect(chain.input);
                chain.output.connect(trackName === 'vocal' ? this.vocalAnalyser : this.musicAnalyser);

                // Nyalakan semua oscillator di rantai yang baru (karena Web Audio osc hanya bisa di-start 1 kali)
                chain.nodes.forEach(n => {
                    if (n.start) {
                        try { n.start(0); } catch(e){}
                    }
                });
            }

            setTrackVolume(trackName, volume, muted) {
                this.tracks[trackName].volume = volume;
                this.tracks[trackName].muted = muted;
                if (this.tracks[trackName].volumeNode) {
                    this.tracks[trackName].volumeNode.gain.value = muted ? 0 : volume;
                }
            }

            setDistortionLevel(trackName, level) {
                const track = this.tracks[trackName];
                if (track.activeLevel === level) {
                    // Matikan efek jika ditekan ulang
                    track.activeLevel = null;
                    track.activeDistortions = [];
                } else {
                    track.activeLevel = level;
                    // Menggabungkan 3 efek di belakang layar untuk setiap level
                    if (level === 'low') track.activeDistortions = [1, 3, 7];
                    else if (level === 'medium') track.activeDistortions = [2, 5, 8];
                    else if (level === 'hard') track.activeDistortions = [4, 6, 10];
                }
                
                // Bangun ulang secara instan
                this.rebuildTrackEffects(trackName);
                return track.activeLevel;
            }

            play(offset = 0) {
                if (!this.vocalBuffer || !this.musicBuffer) return;
                
                this.vocalSource = this.ctx.createBufferSource();
                this.vocalSource.buffer = this.vocalBuffer;
                this.vocalSource.connect(this.tracks.vocal.volumeNode);
                
                this.musicSource = this.ctx.createBufferSource();
                this.musicSource.buffer = this.musicBuffer;
                this.musicSource.connect(this.tracks.music.volumeNode);

                this.startTime = this.ctx.currentTime - offset;
                this.vocalSource.start(0, offset);
                this.musicSource.start(0, offset);
                this.isPlaying = true;
            }

            stop() {
                if (this.vocalSource) { try{this.vocalSource.stop();}catch(e){} }
                if (this.musicSource) { try{this.musicSource.stop();}catch(e){} }
                this.isPlaying = false;
                this.pauseTime = this.ctx.currentTime - this.startTime;
            }
            
            seek(percent) {
                const time = (percent / 100) * this.duration;
                if (this.isPlaying) { this.stop(); this.play(time); } 
                else { this.pauseTime = time; }
            }
            
            getCurrentTime() {
                if (!this.isPlaying) return this.pauseTime;
                let t = this.ctx.currentTime - this.startTime;
                if (t >= this.duration) { this.stop(); this.pauseTime = 0; return 0; }
                return t;
            }

            async renderOffline(type, onProgress) {
                const sr = this.originalBuffer.sampleRate;
                const len = this.originalBuffer.length;
                // Harus bikin context offline baru untuk render file jadi
                const offlineCtx = new OfflineAudioContext(2, len, sr);
                
                const vSrc = offlineCtx.createBufferSource(); vSrc.buffer = this.vocalBuffer;
                const mSrc = offlineCtx.createBufferSource(); mSrc.buffer = this.musicBuffer;
                
                const vVol = offlineCtx.createGain(); vVol.gain.value = type === 'music' ? 0 : this.tracks.vocal.volume;
                const mVol = offlineCtx.createGain(); mVol.gain.value = type === 'vocal' ? 0 : this.tracks.music.volume;

                vSrc.connect(vVol); mSrc.connect(mVol);

                // Aplikasikan efek ke file offline
                const vChain = buildEffectChain(offlineCtx, this.tracks.vocal.activeDistortions);
                const mChain = buildEffectChain(offlineCtx, this.tracks.music.activeDistortions);

                vVol.connect(vChain.input); mVol.connect(mChain.input);
                vChain.output.connect(offlineCtx.destination);
                mChain.output.connect(offlineCtx.destination);

                // Start semua filter oscillator
                vChain.nodes.forEach(n => { if(n.start) n.start(0); });
                mChain.nodes.forEach(n => { if(n.start) n.start(0); });
                vSrc.start(0); mSrc.start(0);

                onProgress(30, "Merender audio dengan efek...");
                return await offlineCtx.startRendering();
            }
        }

        const engine = new AudioEngine();

        function App() {
            const [screen, setScreen] = useState('home');
            const [progress, setProgress] = useState({ percent: 0, text: '' });
            const [fileName, setFileName] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            
            const [currentTime, setCurrentTime] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [activeSheet, setActiveSheet] = useState(null);
            
            // State untuk re-render UI
            const [tracksState, setTracksState] = useState({
                vocal: { muted: false, volume: 1, activeLevel: null },
                music: { muted: false, volume: 1, activeLevel: null }
            });

            useEffect(() => {
                let req;
                const update = () => {
                    if (engine.isPlaying) setCurrentTime(engine.getCurrentTime());
                    req = requestAnimationFrame(update);
                };
                req = requestAnimationFrame(update);
                return () => cancelAnimationFrame(req);
            }, []);

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60); const s = Math.floor(secs % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const handleFile = async (file) => {
                if (!file) return;
                setFileName(file.name); setScreen('processing'); setErrorMsg('');
                try {
                    await engine.loadAudio(file, (pct, txt) => setProgress({ percent: pct, text: txt }));
                    setScreen('studio');
                } catch (err) {
                    console.error(err); setErrorMsg("Gagal memproses file audio."); setScreen('home');
                }
            };

            const togglePlay = () => {
                if (engine.isPlaying) { engine.stop(); setIsPlaying(false); setCurrentTime(engine.getCurrentTime()); } 
                else { engine.play(engine.getCurrentTime()); setIsPlaying(true); }
            };

            const handleSeek = (e) => {
                engine.seek(parseFloat(e.target.value));
                setCurrentTime(engine.getCurrentTime());
            };

            // Fungsi untuk update Volume dari Slider
            const setVolume = (trackName, vol) => {
                engine.setTrackVolume(trackName, vol, tracksState[trackName].muted);
                setTracksState(prev => ({ ...prev, [trackName]: { ...prev[trackName], volume: vol } }));
            };

            // Fungsi untuk menekan Mute
            const toggleMute = (trackName) => {
                const newMute = !tracksState[trackName].muted;
                engine.setTrackVolume(trackName, tracksState[trackName].volume, newMute);
                setTracksState(prev => ({ ...prev, [trackName]: { ...prev[trackName], muted: newMute } }));
            };

            // Fungsi untuk ubah Level Distorsi
            const setDistortion = (trackName, level) => {
                const activeLvl = engine.setDistortionLevel(trackName, level);
                setTracksState(prev => ({ ...prev, [trackName]: { ...prev[trackName], activeLevel: activeLvl } }));
            };

            return (
                <div className="flex flex-col h-full bg-[#121212] text-white">
                    <div className="pt-8 pb-4 px-6 bg-gradient-to-b from-gray-900 to-transparent">
                        <h1 className="text-xl font-bold flex items-center gap-2">
                            <i className="fa-solid fa-bolt text-yellow-500"></i> Distortion Maker
                        </h1>
                    </div>

                    <div className="flex-1 overflow-y-auto px-4 pb-24 relative">
                        {errorMsg && (
                            <div className="bg-red-500/20 border border-red-500/50 text-red-200 p-3 rounded-xl mb-4 text-sm flex gap-3 items-center">
                                <i className="fa-solid fa-triangle-exclamation"></i> <span>{errorMsg}</span>
                            </div>
                        )}

                        {screen === 'home' && <Home onFileSelected={handleFile} />}
                        {screen === 'processing' && <Processing progress={progress} />}
                        {screen === 'studio' && (
                            <Studio 
                                fileName={fileName} duration={engine.duration} currentTime={currentTime}
                                isPlaying={isPlaying} togglePlay={togglePlay} handleSeek={handleSeek} formatTime={formatTime}
                                tracksState={tracksState} setVolume={setVolume} toggleMute={toggleMute} 
                                openSheet={setActiveSheet} engine={engine}
                            />
                        )}
                    </div>

                    {/* MODALS / BOTTOM SHEETS */}
                    {activeSheet && (
                        <div className="fixed inset-0 z-50 flex flex-col justify-end">
                            <div className="absolute inset-0 bg-black/70 backdrop-blur-md" onClick={() => setActiveSheet(null)}></div>
                            <div className="bg-gray-900 border-t border-gray-700 rounded-t-3xl p-6 relative z-10 animate-[slideUp_0.3s_ease-out] max-h-[90vh] overflow-hidden flex flex-col shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
                                <div className="w-12 h-1.5 bg-gray-600 rounded-full mx-auto mb-5 shrink-0"></div>
                                <div className="overflow-y-auto flex-1 pb-10">
                                    {activeSheet === 'vocal' && <EffectSheet trackType="vocal" activeLevel={tracksState.vocal.activeLevel} onToggle={(level) => setDistortion('vocal', level)} onClose={() => setActiveSheet(null)} />}
                                    {activeSheet === 'music' && <EffectSheet trackType="music" activeLevel={tracksState.music.activeLevel} onToggle={(level) => setDistortion('music', level)} onClose={() => setActiveSheet(null)} />}
                                    {activeSheet === 'export' && <ExportSheet engine={engine} fileName={fileName} onClose={() => setActiveSheet(null)} />}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function Home({ onFileSelected }) {
            const fileInputRef = useRef(null);
            return (
                <div 
                    className="flex flex-col items-center justify-center h-full min-h-[60vh] border-2 border-dashed border-gray-700 rounded-2xl p-6 text-center transition-colors hover:border-blue-500 hover:bg-blue-500/5 cursor-pointer"
                    onDragOver={(e) => e.preventDefault()} onDrop={(e) => { e.preventDefault(); if(e.dataTransfer.files[0]) onFileSelected(e.dataTransfer.files[0]); }}
                    onClick={() => fileInputRef.current.click()}
                >
                    <div className="w-20 h-20 rounded-full bg-blue-500/20 flex items-center justify-center mb-6 text-blue-400 text-3xl"><i className="fa-solid fa-music"></i></div>
                    <h2 className="text-lg font-semibold mb-2">Pilih / Seret Lagu Ke Sini</h2>
                    <p className="text-sm text-gray-400">Gunakan lagu dengan vokal untuk hasil terbaik.</p>
                    <input type="file" ref={fileInputRef} className="hidden" accept="audio/*" onChange={(e) => { if(e.target.files[0]) onFileSelected(e.target.files[0]); }} />
                </div>
            );
        }

        function Processing({ progress }) {
            return (
                <div className="flex flex-col items-center justify-center h-full min-h-[60vh]">
                    <div className="relative w-32 h-32 mb-8">
                        <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="45" fill="none" stroke="#1f2937" strokeWidth="8" />
                            <circle cx="50" cy="50" r="45" fill="none" stroke="#3b82f6" strokeWidth="8" strokeDasharray="283" strokeDashoffset={283 - (progress.percent / 100) * 283} strokeLinecap="round" className="transition-all duration-300" />
                        </svg>
                        <div className="absolute inset-0 flex items-center justify-center text-2xl font-bold text-blue-400">{progress.percent}%</div>
                    </div>
                    <p className="text-gray-300 mb-6 font-medium animate-pulse">{progress.text}</p>
                </div>
            );
        }

        function Studio({ fileName, duration, currentTime, isPlaying, togglePlay, handleSeek, formatTime, tracksState, setVolume, toggleMute, openSheet, engine }) {
            const pct = duration > 0 ? (currentTime / duration) * 100 : 0;
            return (
                <div className="flex flex-col h-full animate-[fadeIn_0.5s_ease-out]">
                    {/* Visualizer Jarum */}
                    <div className="flex gap-2 mb-4 h-28">
                        <div className="flex-1 bg-gray-900 rounded-2xl overflow-hidden relative border border-gray-800 shadow-inner">
                            <span className="absolute top-2 left-2 text-[10px] text-pink-500 font-bold z-10 bg-black/60 px-2 py-0.5 rounded-md border border-pink-500/30">VOKAL</span>
                            <NeedleVisualizer analyser={engine.vocalAnalyser} color="#ec4899" isPlaying={isPlaying} />
                        </div>
                        <div className="flex-1 bg-gray-900 rounded-2xl overflow-hidden relative border border-gray-800 shadow-inner">
                            <span className="absolute top-2 left-2 text-[10px] text-emerald-500 font-bold z-10 bg-black/60 px-2 py-0.5 rounded-md border border-emerald-500/30">MUSIK</span>
                            <NeedleVisualizer analyser={engine.musicAnalyser} color="#10b981" isPlaying={isPlaying} />
                        </div>
                    </div>

                    <div className="mb-6 bg-gray-800/40 p-4 rounded-2xl border border-gray-700/50">
                        <h2 className="font-semibold text-md truncate text-blue-100" title={fileName}>{fileName}</h2>
                        <div className="flex justify-between text-xs text-gray-400 mt-2 font-mono"><span>{formatTime(currentTime)}</span><span>{formatTime(duration)}</span></div>
                        <div className="mt-2 relative">
                            <input type="range" min="0" max="100" step="0.1" value={pct || 0} onChange={handleSeek} className="slider-custom w-full absolute inset-0 z-10 opacity-0 cursor-pointer" />
                            <div className="h-2.5 bg-gray-800 rounded-full overflow-hidden shadow-inner">
                                <div className="h-full bg-gradient-to-r from-blue-600 to-blue-400 rounded-full pointer-events-none" style={{ width: `${pct}%` }}></div>
                            </div>
                        </div>
                    </div>

                    <div className="space-y-3">
                        <TrackControl title="Vokal" type="vocal" color="pink" state={tracksState.vocal} onOpenFX={() => openSheet('vocal')} onVolume={(v) => setVolume('vocal', v)} onMute={() => toggleMute('vocal')} />
                        <TrackControl title="Musik" type="music" color="emerald" state={tracksState.music} onOpenFX={() => openSheet('music')} onVolume={(v) => setVolume('music', v)} onMute={() => toggleMute('music')} />
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-panel p-4 flex justify-between items-center rounded-t-3xl z-40">
                        <button onClick={() => engine.seek(0)} className="w-12 h-12 flex items-center justify-center rounded-full text-gray-300 hover:bg-gray-700/50 transition-colors"><i className="fa-solid fa-backward-step"></i></button>
                        <button onClick={togglePlay} className="w-16 h-16 rounded-full bg-blue-600 text-white shadow-[0_0_20px_rgba(37,99,235,0.5)] transform transition active:scale-90 text-2xl"><i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play ml-1'}`}></i></button>
                        <button onClick={() => openSheet('export')} className="h-12 px-6 rounded-full bg-white text-black font-bold shadow-lg hover:bg-gray-200 transition-colors"><i className="fa-solid fa-download mr-2"></i> MP3</button>
                    </div>
                </div>
            );
        }

        function NeedleVisualizer({ analyser, color, isPlaying }) {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                let req;
                const draw = () => {
                    req = requestAnimationFrame(draw);
                    analyser.getByteFrequencyData(dataArray);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    const barWidth = Math.max(1, (canvas.width / bufferLength) * 1.5);
                    let x = 0;
                    for(let i = 0; i < bufferLength; i++) {
                        const barHeight = (dataArray[i] / 255) * canvas.height;
                        ctx.fillStyle = color;
                        ctx.fillRect(x, canvas.height - barHeight, Math.min(2, barWidth - 1), barHeight);
                        x += barWidth;
                    }
                };
                draw();
                return () => cancelAnimationFrame(req);
            }, [isPlaying, analyser, color]);

            return <canvas ref={canvasRef} width="200" height="100" className="w-full h-full absolute inset-0 opacity-80 mix-blend-screen"></canvas>;
        }

        function TrackControl({ title, type, color, state, onOpenFX, onVolume, onMute }) {
            const isFxOn = state.activeLevel !== null;
            
            // Nama label tombol berdasarkan level
            let btnLabel = "Pilih Efek";
            if (state.activeLevel === 'low') btnLabel = "Low Dist";
            else if (state.activeLevel === 'medium') btnLabel = "Med Dist";
            else if (state.activeLevel === 'hard') btnLabel = "Hard Dist";

            return (
                <div className={`bg-gray-800/60 border ${isFxOn ? `border-${color}-500/40` : 'border-gray-700'} rounded-2xl p-4 transition-all`}>
                    <div className="flex justify-between items-center mb-3">
                        <div className="flex items-center gap-3">
                            <div className={`w-3 h-3 rounded-full bg-${color}-500 shadow-[0_0_10px_currentColor]`}></div>
                            <h3 className="font-bold text-lg">{title}</h3>
                        </div>
                        <button onClick={onOpenFX} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm ${isFxOn ? `bg-${color}-500 text-white shadow-[0_0_15px_rgba(236,72,153,0.3)]` : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`}>
                            <i className="fa-solid fa-bolt mr-2"></i> {btnLabel}
                        </button>
                    </div>
                    {/* Volume Slider - Fixed & Binded */}
                    <div className="flex gap-3 items-center">
                        <button onClick={onMute} className={`w-10 h-10 shrink-0 rounded-lg flex items-center justify-center transition-colors ${state.muted ? 'bg-red-500/20 text-red-400' : 'bg-gray-700/50 text-gray-400 hover:text-white'}`}><i className={`fa-solid ${state.muted ? 'fa-volume-xmark' : 'fa-volume-high'}`}></i></button>
                        <input type="range" min="0" max="1.5" step="0.05" value={state.volume} onChange={(e) => onVolume(parseFloat(e.target.value))} className={`slider-custom ${type} flex-1`} />
                    </div>
                </div>
            );
        }

        function EffectSheet({ trackType, activeLevel, onToggle, onClose }) {
            const isVocal = trackType === 'vocal';
            const textC = isVocal ? 'text-pink-400' : 'text-emerald-400';
            const borderC = isVocal ? 'border-pink-500' : 'border-emerald-500';

            const levels = [
                { id: 'low', name: "Low", desc: "Ringan (Drive + 8-Bit + Comb Filter)", icon: "fa-battery-quarter" },
                { id: 'medium', name: "Medium", desc: "Sedang (Fuzz + Robot + Radio)", icon: "fa-battery-half" },
                { id: 'hard', name: "Hard", desc: "Ekstrem (4-Bit + Alien + Nuclear)", icon: "fa-battery-full", extreme: true },
            ];

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-center sticky top-0 bg-gray-900 pb-4 z-10 border-b border-gray-800">
                        <div>
                            <h2 className={`text-xl font-bold flex items-center gap-2 ${textC}`}><i className="fa-solid fa-bolt"></i> Level Distorsi</h2>
                            <p className="text-xs text-gray-400 mt-1">Satu tombol mengaktifkan 3 efek sekaligus.</p>
                        </div>
                        <button onClick={onClose} className="w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-700"><i className="fa-solid fa-xmark text-lg"></i></button>
                    </div>

                    <div className="flex flex-col gap-3">
                        {levels.map(lvl => {
                            const isActive = activeLevel === lvl.id;
                            return (
                                <button key={lvl.id} onClick={() => onToggle(lvl.id)} className={`btn-dist flex items-center p-4 rounded-2xl border-2 text-left ${isActive ? `${textC} ${borderC} bg-gray-800/80` : 'text-gray-400 border-gray-800 bg-gray-900 hover:bg-gray-800'}`}>
                                    <div className={`w-12 h-12 rounded-full flex items-center justify-center text-2xl shrink-0 mr-4 ${isActive ? 'bg-gray-700/50' : 'bg-gray-800'}`}>
                                        <i className={`fa-solid ${lvl.icon} ${lvl.extreme && isActive ? 'animate-pulse text-red-500' : ''}`}></i>
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-lg">{lvl.name}</h3>
                                        <p className="text-xs opacity-70 mt-1">{lvl.desc}</p>
                                    </div>
                                    {isActive && <i className="fa-solid fa-circle-check text-2xl ml-auto"></i>}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function ExportSheet({ engine, fileName, onClose }) {
            const [exportType, setExportType] = useState('gabungan');
            const [quality, setQuality] = useState(128); 
            const [isExporting, setIsExporting] = useState(false);
            const [exportStatus, setExportStatus] = useState('');

            const handleExport = async () => {
                setIsExporting(true); setExportStatus('Menyiapkan buffer audio...');
                try {
                    // Render Offline (SUDAH TERMASUK EFEK DISTORSI 1-10)
                    const renderedBuffer = await engine.renderOffline(exportType, (pct, txt) => setExportStatus(txt));
                    setExportStatus('Mengompresi ke MP3...'); 
                    await new Promise(r => setTimeout(r, 100));
                    
                    const mp3encoder = new lamejs.Mp3Encoder(2, renderedBuffer.sampleRate, quality);
                    const mp3Data = [];
                    const left = renderedBuffer.getChannelData(0);
                    const right = renderedBuffer.numberOfChannels > 1 ? renderedBuffer.getChannelData(1) : left;
                    const len = left.length;
                    const leftInt16 = new Int16Array(len); const rightInt16 = new Int16Array(len);
                    
                    for(let i=0; i<len; i++) {
                        leftInt16[i] = left[i] < 0 ? left[i] * 32768 : left[i] * 32767;
                        rightInt16[i] = right[i] < 0 ? right[i] * 32768 : right[i] * 32767;
                    }

                    const sampleBlockSize = 1152 * 5; 
                    for(let i=0; i<len; i+=sampleBlockSize) {
                        const lChunk = leftInt16.subarray(i, i+sampleBlockSize);
                        const rChunk = rightInt16.subarray(i, i+sampleBlockSize);
                        const buf = mp3encoder.encodeBuffer(lChunk, rChunk);
                        if(buf.length > 0) mp3Data.push(buf);
                        if (i % (sampleBlockSize * 10) === 0) {
                            setExportStatus(`Proses Konversi... ${Math.floor((i/len)*100)}%`);
                            await new Promise(r => setTimeout(r, 1)); // Yield UI
                        }
                    }
                    const buf = mp3encoder.flush(); if(buf.length > 0) mp3Data.push(buf);
                    
                    const blob = new Blob(mp3Data, { type: 'audio/mp3' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = `${fileName.replace(/\.[^/.]+$/, "")}_${exportType}_distorsi.mp3`;
                    a.click(); window.URL.revokeObjectURL(url);
                    setTimeout(() => { setIsExporting(false); onClose(); }, 500);
                } catch (e) {
                    console.error(e); setExportStatus('Gagal mengekspor!'); setTimeout(() => setIsExporting(false), 2000);
                }
            };

            const estSize = ((quality * engine.duration) / 8 / 1024).toFixed(1);

            return (
                <div className="space-y-5 relative">
                    {isExporting && (
                        <div className="absolute inset-0 z-20 bg-gray-900/95 flex flex-col items-center justify-center rounded-2xl border border-gray-700 shadow-2xl backdrop-blur-md">
                            <i className="fa-solid fa-spinner fa-spin text-4xl text-blue-500 mb-4"></i>
                            <p className="font-bold text-lg text-white">{exportStatus}</p>
                            <p className="text-sm text-gray-400 mt-2">Mohon jangan tutup halaman</p>
                        </div>
                    )}
                    
                    <h2 className="text-xl font-bold flex items-center gap-2 mb-4"><i className="fa-solid fa-cloud-arrow-down text-blue-400"></i> Unduh Hasil (MP3)</h2>
                    
                    <div>
                        <label className="text-xs text-gray-400 mb-2 block">1. Pilih Sumber Audio</label>
                        <div className="flex bg-gray-800 p-1 rounded-xl">
                            {['vocal', 'gabungan', 'music'].map(t => (
                                <button key={t} onClick={() => setExportType(t)} className={`flex-1 py-2 text-sm font-bold rounded-lg capitalize transition-colors ${exportType === t ? 'bg-blue-600 text-white shadow-md' : 'text-gray-400 hover:text-white'}`}>{t}</button>
                            ))}
                        </div>
                    </div>

                    <div>
                        <label className="text-xs text-gray-400 mb-2 block">2. Pilih Kualitas (Bitrate)</label>
                        <select value={quality} onChange={e => setQuality(parseInt(e.target.value))} className="w-full bg-gray-800 border border-gray-700 text-white rounded-xl p-3 outline-none focus:border-blue-500">
                            <option value="64">Hemat Maksimal (64 kbps) - Ukuran Kecil</option>
                            <option value="128">Standar (128 kbps) - Disarankan</option>
                            <option value="192">Kualitas Tinggi (192 kbps) - File Besar</option>
                        </select>
                    </div>

                    <div className="bg-blue-900/20 border border-blue-500/30 p-3 rounded-xl flex items-center justify-between">
                        <span className="text-sm text-blue-200">Perkiraan Ukuran:</span>
                        <span className="font-mono font-bold text-blue-400">± {estSize} MB</span>
                    </div>

                    <button onClick={handleExport} className="w-full py-4 bg-white text-black font-bold text-lg rounded-2xl active:scale-95 transition-transform shadow-[0_0_20px_rgba(255,255,255,0.2)]">
                        Mulai Unduh
                    </button>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
