    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        html, body {
            height: 100%;
            height: 100dvh;
        }

            background-color: #0A0D14;
            color: #f8fafc;

            width: 100%;

            border-radius: 2px;

        input[type=range]::-webkit-slider-thumb {

        .slider-music::-webkit-slider-thumb { border-color: #10b981; }

        /* Visualizer Grid Background */

            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: center bottom;
        }

        /* Custom Toggle Switch */
        .toggle-checkbox:checked { right: 0; border-color: #3b82f6; }
        .toggle-checkbox:checked + .toggle-label { background-color: #3b82f6; }
        .toggle-checkbox:checked.toggle-vocal { border-color: #ec4899; }
        .toggle-checkbox:checked.toggle-vocal + .toggle-label { background-color: #ec4899; }
        .toggle-checkbox:checked.toggle-music { border-color: #10b981; }
        .toggle-checkbox:checked.toggle-music + .toggle-label { background-color: #10b981; }

        .glass-panel {
            background: rgba(21, 24, 34, 0.85);

<body class="flex justify-center h-screen w-screen overflow-hidden">

    <!-- Mobile constraint layout -->
    <div id="root" class="w-full max-w-md h-full bg-dsp-bg relative flex flex-col shadow-2xl overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- CORE AUDIO LOGIC (UNCHANGED) ---
        function makeDistCurve(amount) {
            let k = amount, n = 44100, curve = new Float32Array(n), deg = Math.PI / 180;
            for (let i = 0; i < n; ++i) {
                let x = (i * 2 / n) - 1;
                curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        function makeCrushCurve(bits) {
            let n = 44100, curve = new Float32Array(n);
            let steps = Math.pow(2, bits);
            for(let i=0; i<n; i++) {
                let x = (i * 2 / n) - 1;
                curve[i] = Math.round(x * steps) / steps;
            }
            return curve;
        }

        function makeHardClipCurve() {
            let n = 44100, curve = new Float32Array(n);
            for (let i = 0; i < n; ++i) {
                let x = (i * 2 / n) - 1;
                curve[i] = x < -0.2 ? -0.2 : (x > 0.2 ? 0.2 : x);
            }
            return curve;
        }

        function buildEffectChain(ctx, activeDistortions) {
            let input = ctx.createGain();
            let current = input;
            let nodes = [input];

            const dists = [...activeDistortions].sort((a,b) => a - b);

            dists.forEach(d => {
                let fxIn = ctx.createGain();
                let fxOut = ctx.createGain();
                current.connect(fxIn);
                
                if (d === 1) { 
                    let ws = ctx.createWaveShaper(); ws.curve = makeDistCurve(50);
                    fxIn.connect(ws); ws.connect(fxOut); nodes.push(ws);
                }
                else if (d === 2) { 
                    let ws = ctx.createWaveShaper(); ws.curve = makeDistCurve(400);
                    fxIn.connect(ws); ws.connect(fxOut); nodes.push(ws);
                }
                else if (d === 3) { 
                    let ws = ctx.createWaveShaper(); ws.curve = makeCrushCurve(4);
                    fxIn.connect(ws); ws.connect(fxOut); nodes.push(ws);
                }
                else if (d === 4) { 
                    let ws = ctx.createWaveShaper(); ws.curve = makeCrushCurve(2);
                    fxIn.connect(ws); ws.connect(fxOut); nodes.push(ws);
                }
                else if (d === 5) { 
                    let osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = 50;
                    let rmGain = ctx.createGain(); rmGain.gain.value = 0;
                    osc.connect(rmGain.gain);
                    fxIn.connect(rmGain); rmGain.connect(fxOut); nodes.push(osc, rmGain);
                }
                else if (d === 6) { 
                    let osc = ctx.createOscillator(); osc.type = 'square'; osc.frequency.value = 200;
                    let rmGain = ctx.createGain(); rmGain.gain.value = 0;
                    osc.connect(rmGain.gain);
                    fxIn.connect(rmGain); rmGain.connect(fxOut); nodes.push(osc, rmGain);
                }
                else if (d === 7) { 
                    let delay = ctx.createDelay(); delay.delayTime.value = 0.015;
                    let feedback = ctx.createGain(); feedback.gain.value = 0.85;
                    fxIn.connect(delay); delay.connect(feedback); feedback.connect(delay); delay.connect(fxOut);
                    fxIn.connect(fxOut); 
                    nodes.push(delay, feedback);
                }
                else if (d === 8) { 
                    let bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1000;
                    let ws = ctx.createWaveShaper(); ws.curve = makeDistCurve(200);
                    fxIn.connect(bp); bp.connect(ws); ws.connect(fxOut); nodes.push(bp, ws);
                }
                else if (d === 9) { 
                    let osc = ctx.createOscillator(); osc.type = 'square'; osc.frequency.value = 15;
                    let amGain = ctx.createGain(); amGain.gain.value = 0;
                    osc.connect(amGain.gain);
                    fxIn.connect(amGain); amGain.connect(fxOut); nodes.push(osc, amGain);
                }
                else if (d === 10) { 
                    let preGain = ctx.createGain(); preGain.gain.value = 10; 
                    let ws = ctx.createWaveShaper(); ws.curve = makeHardClipCurve();
                    let postGain = ctx.createGain(); postGain.gain.value = 0.2; 
                    fxIn.connect(preGain); preGain.connect(ws); ws.connect(postGain); postGain.connect(fxOut);
                    nodes.push(preGain, ws, postGain);
                }

                nodes.push(fxIn, fxOut);
                current = fxOut;
            });

            let output = ctx.createGain();
            current.connect(output);
            nodes.push(output);

            return { input, output, nodes };
        }

        class AudioEngine {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.originalBuffer = null;
                this.vocalBuffer = null;
                this.musicBuffer = null;
                
                this.vocalSource = null;
                this.musicSource = null;
                
                this.masterGain = this.ctx.createGain();
                this.masterGain.connect(this.ctx.destination);

                // Increased fftSize for better visualizer resolution
                this.vocalAnalyser = this.ctx.createAnalyser();
                this.musicAnalyser = this.ctx.createAnalyser();
                this.vocalAnalyser.fftSize = 256; 
                this.musicAnalyser.fftSize = 256;
                this.vocalAnalyser.smoothingTimeConstant = 0.8;
                this.musicAnalyser.smoothingTimeConstant = 0.8;

                this.isPlaying = false;
                this.startTime = 0;
                this.pauseTime = 0;
                this.duration = 0;

                this.tracks = {
                    vocal: { muted: false, volume: 1, activeDistortions: [], activeLevel: null, volumeNode: null, effectNodes: [] },
                    music: { muted: false, volume: 1, activeDistortions: [], activeLevel: null, volumeNode: null, effectNodes: [] }
                };
            }

            async loadAudio(file, onProgress) {
                onProgress(10, "Reading audio file...");
                const arrayBuffer = await file.arrayBuffer();
                onProgress(40, "Decoding audio data...");
                this.originalBuffer = await this.ctx.decodeAudioData(arrayBuffer);
                this.duration = this.originalBuffer.duration;
                
                onProgress(70, "Isolating stems...");
                await this.splitAudio();
                
                onProgress(90, "Preparing DSP engine...");
                this.initBaseNodes();
            }

            async splitAudio() {
                const sr = this.originalBuffer.sampleRate;
                const len = this.originalBuffer.length;
                this.vocalBuffer = this.ctx.createBuffer(1, len, sr);
                this.musicBuffer = this.ctx.createBuffer(2, len, sr);
                const L = this.originalBuffer.getChannelData(0);
                const R = this.originalBuffer.numberOfChannels > 1 ? this.originalBuffer.getChannelData(1) : L;
                const vocData = this.vocalBuffer.getChannelData(0);
                const musL = this.musicBuffer.getChannelData(0);
                const musR = this.musicBuffer.getChannelData(1);
                
                for (let i = 0; i < len; i++) {
                    vocData[i] = (L[i] + R[i]) * 0.5;
                    musL[i] = L[i] - vocData[i];
                    musR[i] = R[i] - vocData[i];
                }
            }

            initBaseNodes() {
                this.tracks.vocal.volumeNode = this.ctx.createGain();
                this.tracks.music.volumeNode = this.ctx.createGain();

                // Connect to master, analysers will intercept the signal
                this.vocalAnalyser.connect(this.masterGain);
                this.musicAnalyser.connect(this.masterGain);

                this.rebuildTrackEffects('vocal');
                this.rebuildTrackEffects('music');
            }

            rebuildTrackEffects(trackName) {
                const track = this.tracks[trackName];
                
                if (track.effectNodes) {
                    track.effectNodes.forEach(n => {
                        try { n.disconnect(); if (n.stop) n.stop(); } catch(e) {}
                    });
                }
                
                const chain = buildEffectChain(this.ctx, track.activeDistortions);
                track.effectNodes = chain.nodes;

                track.volumeNode.disconnect();
                track.volumeNode.connect(chain.input);
                
                // Route through analyser so we can visualize it
                chain.output.connect(trackName === 'vocal' ? this.vocalAnalyser : this.musicAnalyser);

                chain.nodes.forEach(n => {
                    if (n.start) {
                        try { n.start(0); } catch(e){}
                    }
                });
            }

            setTrackVolume(trackName, volume, muted) {
                this.tracks[trackName].volume = volume;
                this.tracks[trackName].muted = muted;
                if (this.tracks[trackName].volumeNode) {
                    this.tracks[trackName].volumeNode.gain.value = muted ? 0 : volume;
                }
            }

            setDistortionLevel(trackName, level) {
                const track = this.tracks[trackName];
                if (track.activeLevel === level) {
                    track.activeLevel = null;
                    track.activeDistortions = [];
                } else {
                    track.activeLevel = level;
                    if (level === 'low') track.activeDistortions = [1, 3, 7];
                    else if (level === 'medium') track.activeDistortions = [2, 5, 8];
                    else if (level === 'hard') track.activeDistortions = [4, 6, 10];
                }
                
                this.rebuildTrackEffects(trackName);
                return track.activeLevel;
            }

            play(offset = 0) {
                if (!this.vocalBuffer || !this.musicBuffer) return;
                
                this.vocalSource = this.ctx.createBufferSource();
                this.vocalSource.buffer = this.vocalBuffer;
                this.vocalSource.connect(this.tracks.vocal.volumeNode);
                
                this.musicSource = this.ctx.createBufferSource();
                this.musicSource.buffer = this.musicBuffer;
                this.musicSource.connect(this.tracks.music.volumeNode);

                this.startTime = this.ctx.currentTime - offset;
                this.vocalSource.start(0, offset);
                this.musicSource.start(0, offset);
                this.isPlaying = true;
            }

            stop() {
                if (this.vocalSource) { try{this.vocalSource.stop();}catch(e){} }
                if (this.musicSource) { try{this.musicSource.stop();}catch(e){} }
                this.isPlaying = false;
                this.pauseTime = this.ctx.currentTime - this.startTime;
            }
            
            seek(percent) {
                const time = (percent / 100) * this.duration;
                if (this.isPlaying) { this.stop(); this.play(time); } 
                else { this.pauseTime = time; }
            }
            
            getCurrentTime() {
                if (!this.isPlaying) return this.pauseTime;
                let t = this.ctx.currentTime - this.startTime;
                if (t >= this.duration) { this.stop(); this.pauseTime = 0; return 0; }
                return t;
            }

            async renderOffline(type, onProgress) {
                const sr = this.originalBuffer.sampleRate;
                const len = this.originalBuffer.length;
                const offlineCtx = new OfflineAudioContext(2, len, sr);
                
                const vSrc = offlineCtx.createBufferSource(); vSrc.buffer = this.vocalBuffer;
                const mSrc = offlineCtx.createBufferSource(); mSrc.buffer = this.musicBuffer;
                
                const vVol = offlineCtx.createGain(); vVol.gain.value = type === 'music' ? 0 : this.tracks.vocal.volume;
                const mVol = offlineCtx.createGain(); mVol.gain.value = type === 'vocal' ? 0 : this.tracks.music.volume;

                vSrc.connect(vVol); mSrc.connect(mVol);

                const vChain = buildEffectChain(offlineCtx, this.tracks.vocal.activeDistortions);
                const mChain = buildEffectChain(offlineCtx, this.tracks.music.activeDistortions);

                vVol.connect(vChain.input); mVol.connect(mChain.input);
                vChain.output.connect(offlineCtx.destination);
                mChain.output.connect(offlineCtx.destination);

                vChain.nodes.forEach(n => { if(n.start) n.start(0); });
                mChain.nodes.forEach(n => { if(n.start) n.start(0); });
                vSrc.start(0); mSrc.start(0);

                onProgress(30, "Rendering DSP effects...");
                return await offlineCtx.startRendering();
            }
        }

        const engine = new AudioEngine();

        function App() {
            const [screen, setScreen] = useState('home');
            const [progress, setProgress] = useState({ percent: 0, text: '' });
            const [fileName, setFileName] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            
            const [currentTime, setCurrentTime] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [activeSheet, setActiveSheet] = useState(null);
            
            const [tracksState, setTracksState] = useState({
                vocal: { muted: false, volume: 1, activeLevel: null },
                music: { muted: false, volume: 1, activeLevel: null }
            });

            useEffect(() => {
                let req;
                const update = () => {
                    if (engine.isPlaying) setCurrentTime(engine.getCurrentTime());
                    req = requestAnimationFrame(update);
                };
                req = requestAnimationFrame(update);
                return () => cancelAnimationFrame(req);
            }, []);

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60); const s = Math.floor(secs % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const handleFile = async (file) => {
                if (!file) return;
                setFileName(file.name); setScreen('processing'); setErrorMsg('');
                try {
                    await engine.loadAudio(file, (pct, txt) => setProgress({ percent: pct, text: txt }));
                    setScreen('studio');
                } catch (err) {
                    console.error(err); setErrorMsg("Failed to process audio file."); setScreen('home');
                }
            };

            const togglePlay = () => {
                if (engine.isPlaying) { engine.stop(); setIsPlaying(false); setCurrentTime(engine.getCurrentTime()); } 
                else { engine.play(engine.getCurrentTime()); setIsPlaying(true); }
            };

            const handleSeek = (e) => {
                engine.seek(parseFloat(e.target.value));
                setCurrentTime(engine.getCurrentTime());
            };

            const setVolume = (trackName, vol) => {
                engine.setTrackVolume(trackName, vol, tracksState[trackName].muted);
                setTracksState(prev => ({ ...prev, [trackName]: { ...prev[trackName], volume: vol } }));
            };

            const toggleMute = (trackName) => {
                const newMute = !tracksState[trackName].muted;
                engine.setTrackVolume(trackName, tracksState[trackName].volume, newMute);
                setTracksState(prev => ({ ...prev, [trackName]: { ...prev[trackName], muted: newMute } }));
            };

            const setDistortion = (trackName, level) => {
                const activeLvl = engine.setDistortionLevel(trackName, level);
                setTracksState(prev => ({ ...prev, [trackName]: { ...prev[trackName], activeLevel: activeLvl } }));
            };

            return (
                <div className="flex flex-col h-full bg-dsp-bg text-dsp-text relative">
                    {/* Header Premium */}
                    <div className="pt-8 pb-3 px-6 flex flex-col items-center border-b border-dsp-border bg-dsp-bg/95 z-20 shrink-0">
                        <h1 className="text-2xl font-bold tracking-wider">DSP</h1>
                        <p className="text-[10px] text-dsp-muted uppercase tracking-widest font-mono">Created by AhmadRV</p>
                    </div>

                    {/* Scrollable Workspace */}
                    <div className="flex-1 overflow-y-auto relative min-h-0">
                        {errorMsg && (
                            <div className="m-4 bg-red-900/30 border border-red-500/50 text-red-200 p-3 rounded-lg text-sm flex gap-3 items-center">
                                <i className="fa-solid fa-circle-exclamation"></i> <span>{errorMsg}</span>
                            </div>
                        )}

                        {screen === 'home' && <Home onFileSelected={handleFile} />}
                        {screen === 'processing' && <Processing progress={progress} />}
                        {screen === 'studio' && (
                            <Studio 
                                fileName={fileName} duration={engine.duration} currentTime={currentTime}
                                isPlaying={isPlaying} togglePlay={togglePlay} handleSeek={handleSeek} formatTime={formatTime}
                                tracksState={tracksState} setVolume={setVolume} toggleMute={toggleMute} 
                                setDistortion={setDistortion} engine={engine}
                            />
                        )}
                    </div>

                    {/* Transport Bar (In normal flow, fixed issue where it gets cut off) */}
                    {screen === 'studio' && (
                        <div className="shrink-0 glass-panel border-t border-dsp-border flex flex-col z-40 pb-2">
                            <div className="px-6 h-24 flex justify-between items-center w-full">
                                <button onClick={() => engine.seek(0)} className="w-12 h-12 flex items-center justify-center text-dsp-text hover:text-dsp-accent transition-colors">
                                    <i className="fa-solid fa-backward-step text-xl"></i>
                                </button>
                                <button onClick={togglePlay} className="w-16 h-16 rounded-full bg-dsp-accent text-white shadow-[0_4px_14px_rgba(59,130,246,0.4)] flex items-center justify-center transform transition active:scale-95 shrink-0">
                                    <i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play ml-1'} text-2xl`}></i>
                                </button>
                                <button onClick={() => setActiveSheet('export')} className="h-12 px-5 rounded-lg border border-dsp-border bg-dsp-panel hover:bg-dsp-panelHover text-sm font-semibold transition-colors flex items-center gap-2 shrink-0">
                                    <i className="fa-solid fa-arrow-up-right-from-square text-dsp-muted"></i> Export
                                </button>
                            </div>
                            {/* Safe area spacer - terpisah dari alignment tombol */}
                            <div style={{ height: 'env(safe-area-inset-bottom)' }}></div>
                        </div>
                    )}

                    {/* Export Modal */}
                    {activeSheet === 'export' && (
                        <div className="absolute inset-0 z-50 flex flex-col justify-end animate-fade-in">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setActiveSheet(null)}></div>
                            <div className="bg-dsp-panel border-t border-dsp-border rounded-t-2xl p-6 relative z-10 animate-slide-up shadow-2xl">
                                <ExportSheet engine={engine} fileName={fileName} onClose={() => setActiveSheet(null)} />
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function Home({ onFileSelected }) {
            const fileInputRef = useRef(null);
            return (
                <div className="flex flex-col items-center justify-center h-full px-6">
                    <div 
                        className="w-full aspect-square max-h-[300px] border border-dashed border-dsp-border bg-dsp-panel rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:border-dsp-accent transition-colors"
                        onClick={() => fileInputRef.current.click()}
                    >
                        <div className="w-16 h-16 rounded-full bg-dsp-accent/10 flex items-center justify-center mb-4 text-dsp-accent text-2xl">
                            <i className="fa-solid fa-waveform"></i>
                        </div>
                        <h2 className="text-base font-semibold mb-1 text-dsp-text">Select Audio File</h2>
                        <p className="text-xs text-dsp-muted text-center px-8">Supports MP3, WAV. Tracks with clear vocals yield best results.</p>
                        <input type="file" ref={fileInputRef} className="hidden" accept="audio/*" onChange={(e) => { if(e.target.files[0]) onFileSelected(e.target.files[0]); }} />
                    </div>
                </div>
            );
        }

        function Processing({ progress }) {
            return (
                <div className="flex flex-col items-center justify-center h-full">
                    <div className="relative w-24 h-24 mb-6">
                        <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="45" fill="none" stroke="#252a3a" strokeWidth="6" />
                            <circle cx="50" cy="50" r="45" fill="none" stroke="#3b82f6" strokeWidth="6" strokeDasharray="283" strokeDashoffset={283 - (progress.percent / 100) * 283} strokeLinecap="round" className="transition-all duration-300" />
                        </svg>
                        <div className="absolute inset-0 flex items-center justify-center text-lg font-bold font-mono">{progress.percent}%</div>
                    </div>
                    <p className="text-sm text-dsp-muted font-mono animate-pulse">{progress.text}</p>
                </div>
            );
        }

        function Studio({ fileName, duration, currentTime, isPlaying, handleSeek, formatTime, tracksState, setVolume, toggleMute, setDistortion, engine }) {
            const pct = duration > 0 ? (currentTime / duration) * 100 : 0;
            
            return (
                <div className="flex flex-col p-4 gap-4 animate-fade-in">
                    
                    {/* Visualizer Area (Replaces broken needles with combined spectrum) */}
                    <div className="bg-dsp-panel border border-dsp-border rounded-xl p-3 shadow-lg relative overflow-hidden">
                        <div className="flex justify-between items-center mb-2 px-1">
                            <div className="text-[10px] font-mono text-dsp-muted uppercase tracking-wider">FR Analyzer</div>
                            <div className="flex gap-3 text-[10px] font-mono">
                                <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-dsp-vocal"></span> Vocal</span>
                                <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-dsp-music"></span> Music</span>
                            </div>
                        </div>
                        
                        <div className="h-32 w-full bg-[#0d1017] rounded-lg border border-[#1a202c] relative viz-bg overflow-hidden">
                            <SpectrumVisualizer engine={engine} isPlaying={isPlaying} />
                            
                            {/* Grid Overlays (Decorative) */}
                            <div className="absolute inset-0 pointer-events-none flex flex-col justify-between py-1 opacity-20">
                                {[...Array(4)].map((_, i) => <div key={i} className="w-full h-px bg-white"></div>)}
                            </div>
                            <div className="absolute inset-0 pointer-events-none flex justify-between px-4 opacity-20">
                                {[...Array(5)].map((_, i) => <div key={i} className="h-full w-px bg-white"></div>)}
                            </div>
                        </div>

                        {/* Custom Timeline/Seeker integrated below visualizer */}
                        <div className="mt-3 relative h-6 group">
                            <div className="absolute left-0 right-0 top-1/2 -translate-y-1/2 flex justify-between text-[10px] font-mono text-dsp-muted px-1 pointer-events-none">
                                <span>{formatTime(currentTime)}</span>
                                <span className="truncate max-w-[120px] mx-2 text-center text-dsp-text/50">{fileName}</span>
                                <span>{formatTime(duration)}</span>
                            </div>
                            <input type="range" min="0" max="100" step="0.1" value={pct || 0} onChange={handleSeek} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                            <div className="absolute left-0 right-0 top-full h-[2px] bg-dsp-border mt-1 rounded-full overflow-hidden">
                                <div className="h-full bg-dsp-accent rounded-full" style={{ width: `${pct}%` }}></div>
                            </div>
                        </div>
                    </div>

                    {/* Track Controls */}
                    <TrackCard title="Vocal Stem" type="vocal" state={tracksState.vocal} onVolume={(v) => setVolume('vocal', v)} onMute={() => toggleMute('vocal')} onDistortion={(l) => setDistortion('vocal', l)} />
                    <TrackCard title="Music Stem" type="music" state={tracksState.music} onVolume={(v) => setVolume('music', v)} onMute={() => toggleMute('music')} onDistortion={(l) => setDistortion('music', l)} />

                </div>
            );
        }

        function SpectrumVisualizer({ engine, isPlaying }) {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const vAnalyser = engine.vocalAnalyser;
                const mAnalyser = engine.musicAnalyser;
                
                const bufferLength = vAnalyser.frequencyBinCount; // 128 (since fft=256)
                const vData = new Uint8Array(bufferLength);
                const mData = new Uint8Array(bufferLength);
                
                let req;
                
                const drawCurve = (dataArray, color, fillStyle) => {
                    ctx.beginPath();
                    ctx.moveTo(0, canvas.height);
                    
                    const sliceWidth = canvas.width * 1.0 / (bufferLength / 1.5); // Only draw lower freqs for better look
                    let x = 0;
                    
                    for(let i = 0; i < bufferLength; i++) {
                        // Smooth out the curve visually
                        const v = dataArray[i] / 255.0;
                        const y = canvas.height - (v * canvas.height * 0.9); // 90% max height
                        
                        if(i === 0) ctx.lineTo(x, y);
                        else {
                            // Simple curve smoothing
                            const prevV = dataArray[i-1] / 255.0;
                            const prevY = canvas.height - (prevV * canvas.height * 0.9);
                            const xc = (x - sliceWidth + x) / 2;
                            const yc = (prevY + y) / 2;
                            ctx.quadraticCurveTo(x - sliceWidth, prevY, xc, yc);
                        }
                        x += sliceWidth;
                    }
                    
                    ctx.lineTo(canvas.width, canvas.height);
                    ctx.lineTo(0, canvas.height);
                    
                    ctx.fillStyle = fillStyle;
                    ctx.fill();
                    
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = color;
                    ctx.stroke();
                };

                const render = () => {
                    req = requestAnimationFrame(render);
                    
                    // Always get data, it will be 0 if not playing
                    vAnalyser.getByteFrequencyData(vData);
                    mAnalyser.getByteFrequencyData(mData);
                    
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // Create gradients
                    const vGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    vGrad.addColorStop(0, 'rgba(236, 72, 153, 0.4)'); // Pink
                    vGrad.addColorStop(1, 'rgba(236, 72, 153, 0.0)');
                    
                    const mGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                    mGrad.addColorStop(0, 'rgba(16, 185, 129, 0.4)'); // Emerald
                    mGrad.addColorStop(1, 'rgba(16, 185, 129, 0.0)');

                    // Draw Music first (background), then Vocal (foreground)
                    drawCurve(mData, '#10b981', mGrad);
                    drawCurve(vData, '#ec4899', vGrad);
                };
                
                render();
                return () => cancelAnimationFrame(req);
            }, [engine]);

            return <canvas ref={canvasRef} width="400" height="150" className="w-full h-full absolute inset-0"></canvas>;
        }

        function TrackCard({ title, type, state, onVolume, onMute, onDistortion }) {
            const isVocal = type === 'vocal';
            const accentHex = isVocal ? '#ec4899' : '#10b981';
            const accentClass = isVocal ? 'text-dsp-vocal' : 'text-dsp-music';
            const toggleClass = isVocal ? 'toggle-vocal' : 'toggle-music';

            return (
                <div className="bg-dsp-panel border border-dsp-border rounded-xl p-4 flex flex-col gap-4">
                    {/* Header & Mute */}
                    <div className="flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <i className={`fa-solid fa-layer-group ${accentClass} text-sm`}></i>
                            <span className="font-semibold text-sm tracking-wide">{title}</span>
                        </div>
                        
                        <div className="flex items-center gap-2">
                            <span className="text-[10px] font-mono text-dsp-muted">MUTE</span>
                            <div className="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                <input type="checkbox" checked={state.muted} onChange={onMute} className={`toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 border-dsp-border appearance-none cursor-pointer z-10 transition-all duration-300 ${toggleClass}`} style={{ top: '2px', left: '2px' }}/>
                                <label className="toggle-label block overflow-hidden h-6 rounded-full bg-dsp-bg border border-dsp-border cursor-pointer transition-colors duration-300"></label>
                            </div>
                        </div>
                    </div>

                    {/* Volume Slider */}
                    <div className="flex items-center gap-3">
                        <i className={`fa-solid fa-volume-low text-xs ${state.muted ? 'text-red-500/50' : 'text-dsp-muted'}`}></i>
                        <div className="flex-1 relative flex items-center">
                            <input type="range" min="0" max="1.5" step="0.05" value={state.volume} onChange={(e) => onVolume(parseFloat(e.target.value))} className={`slider-${type} relative z-10 w-full`} />
                            {/* Visual track progress */}
                            <div className="absolute left-0 h-1 rounded-l-full pointer-events-none" style={{ width: `${(state.volume / 1.5) * 100}%`, backgroundColor: accentHex, top: '50%', transform: 'translateY(-50%)' }}></div>
                        </div>
                    </div>

                    {/* Inline FX Selector (Parametric Style) */}
                    <div className="pt-2 border-t border-dsp-border/50">
                        <div className="text-[10px] font-mono text-dsp-muted mb-2 uppercase">DSP Module</div>
                        <div className="flex bg-dsp-bg p-1 rounded-lg border border-dsp-border">
                            {[
                                { id: 'low', label: 'Drive' },
                                { id: 'medium', label: 'Fuzz' },
                                { id: 'hard', label: 'Crush' }
                            ].map(btn => {
                                const active = state.activeLevel === btn.id;
                                return (
                                    <button 
                                        key={btn.id}
                                        onClick={() => onDistortion(btn.id)}
                                        className={`flex-1 py-1.5 text-xs font-semibold rounded-md transition-all ${active ? (isVocal ? 'bg-dsp-vocal text-white' : 'bg-dsp-music text-white') : 'text-dsp-muted hover:text-dsp-text'}`}
                                    >
                                        {btn.label}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function ExportSheet({ engine, fileName, onClose }) {
            const [exportType, setExportType] = useState('mix');
            const [quality, setQuality] = useState(128); 
            const [isExporting, setIsExporting] = useState(false);
            const [exportStatus, setExportStatus] = useState('');

            const handleExport = async () => {
                setIsExporting(true); setExportStatus('Preparing buffer...');
                try {
                    // Map UI names back to logic names
                    const typeParam = exportType === 'mix' ? 'gabungan' : exportType;
                    const renderedBuffer = await engine.renderOffline(typeParam, (pct, txt) => setExportStatus(txt));
                    
                    setExportStatus('Encoding MP3...'); 
                    await new Promise(r => setTimeout(r, 100));
                    
                    const mp3encoder = new lamejs.Mp3Encoder(2, renderedBuffer.sampleRate, quality);
                    const mp3Data = [];
                    const left = renderedBuffer.getChannelData(0);
                    const right = renderedBuffer.numberOfChannels > 1 ? renderedBuffer.getChannelData(1) : left;
                    const len = left.length;
                    const leftInt16 = new Int16Array(len); const rightInt16 = new Int16Array(len);
                    
                    for(let i=0; i<len; i++) {
                        leftInt16[i] = left[i] < 0 ? left[i] * 32768 : left[i] * 32767;
                        rightInt16[i] = right[i] < 0 ? right[i] * 32768 : right[i] * 32767;
                    }

                    const sampleBlockSize = 1152 * 5; 
                    for(let i=0; i<len; i+=sampleBlockSize) {
                        const lChunk = leftInt16.subarray(i, i+sampleBlockSize);
                        const rChunk = rightInt16.subarray(i, i+sampleBlockSize);
                        const buf = mp3encoder.encodeBuffer(lChunk, rChunk);
                        if(buf.length > 0) mp3Data.push(buf);
                        if (i % (sampleBlockSize * 10) === 0) {
                            setExportStatus(`Encoding... ${Math.floor((i/len)*100)}%`);
                            await new Promise(r => setTimeout(r, 1)); 
                        }
                    }
                    const buf = mp3encoder.flush(); if(buf.length > 0) mp3Data.push(buf);
                    
                    const blob = new Blob(mp3Data, { type: 'audio/mp3' });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = `DSP_${fileName.replace(/\.[^/.]+$/, "")}_${exportType}.mp3`;
                    a.click(); window.URL.revokeObjectURL(url);
                    setTimeout(() => { setIsExporting(false); onClose(); }, 500);
                } catch (e) {
                    console.error(e); setExportStatus('Export failed.'); setTimeout(() => setIsExporting(false), 2000);
                }
            };

            const estSize = ((quality * engine.duration) / 8 / 1024).toFixed(1);

            return (
                <div className="space-y-5">
                    {isExporting ? (
                        <div className="py-10 flex flex-col items-center justify-center text-center">
                            <i className="fa-solid fa-circle-notch fa-spin text-3xl text-dsp-accent mb-4"></i>
                            <p className="font-mono text-sm text-dsp-text">{exportStatus}</p>
                            <p className="text-[10px] text-dsp-muted mt-2">Processing on device. Please wait.</p>
                        </div>
                    ) : (
                        <>
                            <div className="flex justify-between items-center mb-2">
                                <h3 className="font-bold text-lg">Bounce File</h3>
                                <button onClick={onClose} className="text-dsp-muted hover:text-white"><i className="fa-solid fa-xmark"></i></button>
                            </div>

                            <div>
                                <label className="text-[10px] font-mono text-dsp-muted mb-2 block uppercase">Source Output</label>
                                <div className="flex bg-dsp-bg p-1 rounded-lg border border-dsp-border">
                                    {['vocal', 'mix', 'music'].map(t => (
                                        <button key={t} onClick={() => setExportType(t)} className={`flex-1 py-2 text-xs font-semibold rounded-md capitalize transition-colors ${exportType === t ? 'bg-dsp-panel text-dsp-accent border border-dsp-border shadow-sm' : 'text-dsp-muted hover:text-dsp-text'}`}>{t}</button>
                                    ))}
                                </div>
                            </div>

                            <div>
                                <label className="text-[10px] font-mono text-dsp-muted mb-2 block uppercase">Bitrate (kbps)</label>
                                <select value={quality} onChange={e => setQuality(parseInt(e.target.value))} className="w-full bg-dsp-bg border border-dsp-border text-sm font-mono text-dsp-text rounded-lg p-3 outline-none focus:border-dsp-accent">
                                    <option value="128">128 - Standard</option>
                                    <option value="192">192 - High Quality</option>
                                    <option value="320">320 - Lossless approx.</option>
                                </select>
                            </div>

                            <div className="flex justify-between items-center bg-dsp-bg border border-dsp-border p-3 rounded-lg text-xs">
                                <span className="text-dsp-muted">Est. File Size:</span>
                                <span className="font-mono text-dsp-accent">{estSize} MB</span>
                            </div>

                            <button onClick={handleExport} className="w-full py-3.5 bg-dsp-accent text-white font-bold text-sm rounded-lg active:scale-95 transition-transform">
                                Render Audio
                            </button>
                        </>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
